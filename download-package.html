<style>
:root{--bd:#e2e8f0;--t1:#1e293b;--t2:#64748b;--ac:#e74c3c;--tl:#0d9488}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f8fafc;color:var(--t1);line-height:1.6;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:60px 24px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-size:.9rem;margin-bottom:24px;text-decoration:none}
.back:hover{color:var(--tl)}
h1{font-size:2rem;font-weight:700;margin-bottom:12px}
.desc{color:var(--t2);margin-bottom:40px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:32px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:600;margin-bottom:8px}
.sec-title svg{color:var(--ac)}
.sec-desc{font-size:.875rem;color:var(--t2);margin-bottom:16px}
.body{display:flex;align-items:center;gap:24px}
.info{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-size:.8rem;color:var(--t2);width:44px;flex-shrink:0}
a.lnk{font-size:.875rem;color:var(--ac);text-decoration:none;word-break:break-all}
a.lnk:hover{text-decoration:underline}
.code{font-size:.95rem;font-weight:700;letter-spacing:2px;font-family:monospace}
.cp{padding:3px 12px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:.8rem;cursor:pointer}
.cp:hover{border-color:var(--ac);color:var(--ac)}
.qr{flex-shrink:0;text-align:center}
.qr img{width:180px;height:180px;border-radius:8px;border:1px solid var(--bd);background:#fff;padding:6px;display:block}
.qr p{font-size:.75rem;color:var(--t2);margin-top:6px}
.sep{margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--bd)}
@media(max-width:768px){
  .wrap{padding:32px 20px}
  h1{font-size:1.6rem}
  .card{padding:24px 20px}
  .body{flex-direction:column;align-items:stretch}
  .qr{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:12px}
  .qr img{width:120px;height:120px}
  .qr p{margin-top:0;font-size:.85rem}
}
@media(max-width:480px){
  .wrap{padding:24px 14px}
  h1{font-size:1.4rem}
  .desc{font-size:.9rem;margin-bottom:24px}
  .card{padding:20px 16px;border-radius:10px}
  .sec-title{font-size:1rem;margin-bottom:16px}
  .info{padding:12px 14px}
  .row{gap:8px}
  .lbl{width:38px;font-size:.78rem}
  a.lnk{font-size:.8rem;flex:1;min-width:0}
  .cp{flex-shrink:0;padding:4px 10px}
  .code{font-size:.9rem}
  .qr img{width:100px;height:100px}
}
</style>
